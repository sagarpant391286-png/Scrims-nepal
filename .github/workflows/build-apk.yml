name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_RAW_VERSION=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}')
          echo "Detected Java version string: $JAVA_RAW_VERSION"
          JAVA_MAJOR=$(echo "$JAVA_RAW_VERSION" | awk -F '.' '{print $1}')

          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Failed to detect active Java version."
            exit 1
          fi

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi

          echo "Confirmed: Active Java major version is $JAVA_MAJOR (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Reusing existing debug keystore."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"

            if [ ! -f "./debug.keystore" ]; then
              echo "ERROR: Failed to create ./debug.keystore."
              exit 1
            fi
            echo "Successfully generated ./debug.keystore."
          fi
          touch .env

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Expected APK not found at $TARGET_APK"
            echo "Listing APK directory contents:"
            find app/build/outputs/apk -maxdepth 4 -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: APK at $TARGET_APK is empty."
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "ERROR: Target file does not have .apk extension."; exit 1 ;;
          esac

          echo "APK successfully verified at: $TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          TEMP_RELEASE_DIR="${RUNNER_TEMP}/github-release-asset"
          mkdir -p "$TEMP_RELEASE_DIR"
          cp "app/build/outputs/apk/debug/app-debug.apk" "${TEMP_RELEASE_DIR}/app-debug.apk"

          if [ ! -f "${TEMP_RELEASE_DIR}/app-debug.apk" ]; then
            echo "ERROR: Failed to prepare release asset."
            exit 1
          fi

          echo "asset_path=${TEMP_RELEASE_DIR}/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at: ${TEMP_RELEASE_DIR}/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub CLI Verification ==="
          gh --version

          ASSET_FILE="${{ steps.prep_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_FILE" ]; then
            echo "ERROR: Release asset does not exist at $ASSET_FILE"
            exit 1
          fi

          if [ ! -s "$ASSET_FILE" ]; then
            echo "ERROR: Release asset is empty."
            exit 1
          fi

          case "$ASSET_FILE" in
            *app-debug.apk) ;;
            *) echo "ERROR: Release asset filename must be exactly app-debug.apk."; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          ### Automated Debug APK Build

          This is an automatically generated debug APK build created by GitHub Actions.

          - **Workflow Run Number:** ${{ github.run_number }}
          - **Workflow Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit SHA:** \`${{ github.sha }}\`
          - **Build Environment:** Temurin Java 17 / Gradle 9.3.1
          - **Release Asset:** \`app-debug.apk\`

          > **Notice:** This APK is intended for testing and development purposes. It is signed with a temporary debug keystore and is not a Play Store production release.
          EOF
          )

          echo "Creating release $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" "$ASSET_FILE" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

            echo "=== RELEASE PUBLISHED SUCCESSFULLY ==="
            gh release view "$RELEASE_TAG" || true

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "APK Filename: app-debug.apk"
            echo "Direct Download URL: $DIRECT_URL"

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "Your latest debug APK is available for direct download:"
              echo "[$DIRECT_URL]($DIRECT_URL)"
              echo ""
              echo "> Note: The standard Actions backup artifact \`app-debug-apk\` also remains available in the workflow summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release creation did not complete successfully."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available as a backup."
            fi
            {
              echo "## Release Notice"
              echo ""
              echo "Release publishing failed or was skipped, but the Actions artifact \`app-debug-apk\` remains available."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
